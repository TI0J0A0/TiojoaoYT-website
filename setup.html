<body data-page="setup">
<main id="conteudo">

<section class="phead short">
  <div class="sky" aria-hidden="true"><i class="sun"></i><i class="palm r"></i></div>
  <div class="wrap phead-in">
    <span class="postnum">Nº 05 · tiojoaoyt.com/setup</span><br>
    <p class="script">Por trás da live,</p>
    <h1 class="mega">Setup</h1>
    <p class="lead">Gire, aproxime e clique nos equipamentos para ver o que eu uso nas lives.</p>

</section>

<section class="setup-sec">
  <div class="wrap">
    <div class="s3" id="setup3d">
      <div class="s3-bar">
        <div class="tabs s3-chips cut" role="group" aria-label="Categorias do setup"></div>
        <div class="s3-actions">
          <button class="btn btn-sm" type="button" id="s3Live" aria-pressed="false"><span class="dot"></span> Modo live</button>

        </div>
      </div>
      <div class="s3-stage cut">
        <div class="s3-canvas"></div>
        <div class="s3-pins"></div>
        <div class="s3-hint">🖱️ Arraste para girar · role para aproximar · clique num item</div>
        <div class="s3-loading"><span class="spin"></span> Montando o setup…</div>
        <aside class="s3-panel" hidden aria-live="polite"></aside>
      </div>
      <div class="s3-soft"></div>
    </div>
  </div>
